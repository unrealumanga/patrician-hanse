    <style>
      #loading {
        z-index: 100;
        color: #3d4943;
        background: #f0f2ec;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        font: 13px ui-monospace, "SF Mono", Menlo, monospace;
        transition: opacity 0.35s;
        display: flex;
        position: fixed;
        inset: 0;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading b {
        letter-spacing: 0.05em;
        font-size: 18px;
      }
      #loading .sub {
        color: #77817a;
        font-size: 12px;
      }
      #loading .ink {
        background: #dfe3da;
        border-radius: 1px;
        width: 160px;
        height: 2px;
        overflow: hidden;
      }
      #loading .ink:after {
        content: "";
        background: #3d4943;
        width: 40%;
        height: 100%;
        animation: 1.1s ease-in-out infinite ink;
        display: block;
      }
      @keyframes ink {
        0% { transform: translate(-100%); }
        to { transform: translate(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ink:after {
          width: 100%;
          animation: none;
        }
      }
    </style>
